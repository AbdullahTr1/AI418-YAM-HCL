<style>
/* Layout: one phone-width app column, centered; facilitator tools sit below it and only appear at #facilitator */
:root{
  --bg:#E9F0EE; --surface:#FFFFFF; --surface2:#F3F8F6; --ink:#10201D; --muted:#4A5C58; --line:#C5D4CF;
  --brand:#0B6B5F; --brand-ink:#FFFFFF; --brand-soft:#D9EFE9;
  --ai:#FCEBCB; --ai-ink:#4F3200; --ai-line:#D9A23A;
  --danger:#B3261E; --danger-soft:#FBE4E1; --ok:#17622F; --ok-soft:#DCF2E3; --focus:#1D4ED8;
  --font:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1311; --surface:#14231F; --surface2:#101C19; --ink:#E7F1EE; --muted:#A5B8B3; --line:#2D423C;
  --brand:#4FD1BD; --brand-ink:#04211C; --brand-soft:#17382F; --ai:#3A2D10; --ai-ink:#FBE3B0; --ai-line:#8A6A22;
  --danger:#FF8A80; --danger-soft:#3B1B18; --ok:#7BDB9A; --ok-soft:#173424; --focus:#8AB4FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1311; --surface:#14231F; --surface2:#101C19; --ink:#E7F1EE; --muted:#A5B8B3; --line:#2D423C;
  --brand:#4FD1BD; --brand-ink:#04211C; --brand-soft:#17382F; --ai:#3A2D10; --ai-ink:#FBE3B0; --ai-line:#8A6A22;
  --danger:#FF8A80; --danger-soft:#3B1B18; --ok:#7BDB9A; --ok-soft:#173424; --focus:#8AB4FF; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;
  padding-inline:max(0px,env(safe-area-inset-left,0px)) max(0px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1[tabindex]:focus-visible,main:focus-visible{outline:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--surface2);position:relative}
@media(min-width:600px){.wrap{margin:20px auto;min-height:820px;border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 12px 40px rgba(8,40,34,.14)}}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.brand b{display:block;font-size:17px;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:12px}
.tools{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 12px;min-height:40px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.iconbtn{min-width:40px;min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:grid;place-items:center;cursor:pointer}
main{flex:1;padding:16px 16px 24px;display:flex;flex-direction:column;gap:14px;outline:0}
h1{font-size:26px;line-height:1.2;margin:0;outline:0}
h2{font-size:17px;margin:0;line-height:1.25}
p{margin:0}
.sub{color:var(--muted)}
.small{font-size:13px}
.stepper{display:flex;gap:6px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.stepper li{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:4px 11px;font-size:13px}
.stepper li[aria-current="step"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.stepper li.done{color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.sug{border-color:var(--ai-line);box-shadow:0 0 0 1px var(--ai-line) inset}
.card.dim{opacity:.85}
.row{display:flex;gap:10px;align-items:center}
.row.sp{justify-content:space-between}
.glyph{width:46px;height:46px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.grow{flex:1;min-width:0}
.meta{color:var(--muted);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600;border:1px solid transparent}
.ok{background:var(--ok-soft);color:var(--ok)}
.no{background:var(--surface2);color:var(--muted);border-color:var(--line)}
.pend{background:var(--ai);color:var(--ai-ink);border-color:var(--ai-line)}
.canc{background:var(--danger-soft);color:var(--danger)}
.aitag{background:var(--ai);color:var(--ai-ink);border-color:var(--ai-line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:12px;border:2px solid var(--brand);background:var(--brand);color:var(--brand-ink);font-weight:600;cursor:pointer;text-align:center}
.btn.sec{background:var(--surface);color:var(--brand)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
:root[data-theme="dark"] .btn.danger{color:#2B0A07}
.btn.sm{min-height:40px;padding:6px 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--brand);text-decoration:underline;cursor:pointer;padding:8px 0;min-height:40px;text-align:start;font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;min-height:40px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}
label{font-weight:600;font-size:14px;display:block;margin-bottom:4px}
input[type=text],input[type=search],input[type=email],input[type=date],input[type=time]{width:100%;min-height:48px;border:1.5px solid #6C807A;border-radius:12px;padding:8px 12px;background:var(--surface);color:var(--ink)}
input[aria-invalid="true"]{border-color:var(--danger);border-width:2px}
.err{color:var(--danger);font-size:14px;font-weight:500;display:flex;gap:6px;margin-top:6px}
.alert{border-radius:12px;padding:12px;border:1.5px solid var(--danger);background:var(--danger-soft);display:flex;gap:10px}
.note{border-inline-start:4px solid var(--brand);background:var(--surface);border-radius:8px;padding:10px 12px;font-size:14px}
.kv{display:grid;grid-template-columns:1fr;gap:2px;padding-block:8px;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv dt{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
[dir=rtl] .kv dt{letter-spacing:0;text-transform:none;font-size:13px}
.kv dd{margin:0;font-weight:500}
dl{margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ai-box{background:var(--ai);color:var(--ai-ink);border:1px solid var(--ai-line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.ai-box .link{color:var(--ai-ink)}
.switch{display:inline-flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;color:inherit;min-height:40px;font-weight:600}
.switch i{width:44px;height:26px;border-radius:99px;background:#6C807A;position:relative;display:inline-block;flex:none}
.switch i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.switch[aria-checked="true"] i{background:var(--brand)}
.switch[aria-checked="true"] i::after{inset-inline-start:21px}
nav.tabs{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:6px 4px;min-height:52px;border-radius:12px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;position:relative}
nav.tabs button[aria-current="page"]{color:var(--brand);background:var(--brand-soft)}
nav.tabs .mic{color:var(--ai-ink);background:var(--ai);border:1px solid var(--ai-line)}
.badge{position:absolute;top:2px;inset-inline-end:22%;background:var(--brand);color:var(--brand-ink);border-radius:99px;font-size:11px;padding:0 6px;min-width:18px}
.toast{position:fixed;inset-inline:0;bottom:84px;display:flex;justify-content:center;pointer-events:none;z-index:30;padding-inline:16px}
.toast>div{pointer-events:auto;background:#10201D;color:#fff;border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;max-width:398px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast button{background:none;border:0;color:#9FE6D8;font-weight:700;text-decoration:underline;cursor:pointer;min-height:36px}
.scrim{position:absolute;inset:0;background:rgba(5,20,17,.55);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--surface);width:100%;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:88%;overflow:auto}
.sheet.center{border-radius:20px;margin:16px}
.log{display:flex;flex-direction:column;gap:8px;max-height:240px;overflow:auto}
.msg{padding:8px 12px;border-radius:14px;max-width:92%}
.msg.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink)}
.msg.bot{align-self:flex-start;background:var(--surface2);border:1px solid var(--line)}
.msg .row{margin-top:8px;flex-wrap:wrap}
.mic-big{width:72px;height:72px;border-radius:50%;border:3px solid var(--ai-line);background:var(--ai);color:var(--ai-ink);display:grid;place-items:center;cursor:pointer;flex:none}
.mic-big[aria-pressed="true"]{background:var(--danger);color:#fff;border-color:var(--danger);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(179,38,30,.2)}}
@media(prefers-reduced-motion:reduce){.mic-big[aria-pressed="true"]{animation:none}.switch i::after{transition:none}}
[dir=rtl] .flip{transform:scaleX(-1)}
#fac{max-width:430px;margin:12px auto 40px;padding:0 16px}
#fac .card{gap:12px}
details summary{cursor:pointer;font-weight:600;min-height:40px;display:flex;align-items:center}
</style>

/* ---------- ranking (adaptive layer) ---------- */
function matchesQ(i,q){if(!q)return true;const h=norm(`${i.en} ${i.ar} ${i.lender[0]} ${i.lender[1]} ${CATNAME[i.cat][0]}`);return norm(q).split(" ").filter(Boolean).every(w=>h.includes(w))}
function ranked(){
  let list=ITEMS.filter(i=>matchesQ(i,S.q)&&(!S.fAvail||i.avail)&&(!S.fCampus||i.campus));
  const warm=S.personalize&&S.events>=3;
  const score=i=>(i.avail?100:0)+(warm?S.interest[i.cat]*10-(S.dismissed.has(i.id)?15:0):0);
  list=list.map((i,k)=>({i,k,s:score(i)})).sort((a,b)=>b.s-a.s||a.k-b.k);
  let n=0;const sug=new Set();
  if(warm)for(const r of list){if(r.i.avail&&S.interest[r.i.cat]>0&&!S.dismissed.has(r.i.id)&&n<3){sug.add(r.i.id);n++}}
  return {list:list.map(r=>r.i),sug,warm};
}
function topCat(){return Object.entries(S.interest).sort((a,b)=>b[1]-a[1])[0][0]}
function learn(cat,w){S.interest[cat]=(S.interest[cat]||0)+w;S.events++}
function recordSearch(q){const nq=norm(q);for(const [t,ws,c] of TERMS){if(ws.some(w=>nq.includes(norm(w)))){learn(c,1);return}}}

  const R=SCREENS[S.screen]();
  $("#main").innerHTML=R;
  const tabs=$("#tabs");tabs.hidden=!S.user;
  if(S.user){const np=S.requests.filter(r=>r.status==="pending").length;
   tabs.innerHTML=`<button data-act="nav" data-v="S1" ${S.screen==="S1"?'aria-current="page"':""}>${ico.home}<span>${l.home}</span></button>

   <button class="mic" data-act="voice">${ico.mic}<span>${l.ask}</span></button>`}
  renderOverlay();renderToast();renderFac();
  if(opts.focus){const e=$(opts.focus);if(e)e.focus()}
  else if(!opts.keep){const h=$("#h1");if(h){h.focus({preventScroll:true});window.scrollTo(0,0)}}
}
function stepper(n){const l=L();return `<ol class="stepper" aria-label="${l.stepL}">${l.step.map((s,i)=>`<li ${i+1===n?'aria-current="step"':""} class="${i+1<n?"done":""}">${N(i+1)} · ${s}</li>`).join("")}</ol>`}

 <button class="btn" data-act="confirm">${l.confirm}</button><button class="link" data-act="toDates">${l.chg}</button><p class="note">${l.notApproved}</p>`},
S5(){const l=L(),r=S.requests[S.requests.length-1],i=byId(r.item);
 return `${stepper(4)}<h1 id="h1" tabindex="-1">${l.s5h}</h1><div class="note" role="status" style="border-color:var(--ok)">✓ ${l.sentBanner}</div>
 <div class="card"><div class="row sp"><b>${r.id}</b><span class="chip pend">${l.waiting}</span></div><h2>${esc(nm(i))}</h2>${summary(i,r,S.cal)}</div>
 <p class="meta small">${l.simNote}</p><button class="btn" data-act="nav" data-v="S6">${l.viewReq}</button><button class="btn sec" data-act="nav" data-v="S1">${l.another}</button>`},
S6(){const l=L();
 const cards=S.requests.slice().reverse().map(r=>{const i=byId(r.item);const p=r.status==="pending";
  return `<article class="card" aria-label="${r.id}"><div class="row sp"><b>${r.id}</b>${p?`<span class="chip pend">${l.waiting}</span>`:`<span class="chip canc">${ico.x} ${l.cancelled}</span>`}</div><h2>${esc(nm(i))}</h2><div class="meta">${l.lender}: ${pick(i.lender)}</div>
  <dl><div class="kv"><dt>${l.pu}</dt><dd>${fmtDate(r.start,S.cal)} · ${fmtTime(r.time)}</dd></div><div class="kv"><dt>${l.rt}</dt><dd>${fmtDate(r.end,S.cal)}</dd></div></dl>
  ${p?`<button class="btn sec sm" data-act="askCancel" data-id="${r.id}" id="c_${r.id}">${l.cancelReq}</button>`:""}</article>`}).join("");
 return `<h1 id="h1" tabindex="-1">${l.s6h}</h1><p class="sub">${l.s6p}</p>${cards||`<p class="note">${l.empty}</p>`}<p class="meta small">${l.hist}</p><button class="btn" data-act="nav" data-v="S1">${l.another}</button>`},
E1(){const l=L(),i=byId(S.e1Item);
 const alts=ITEMS.filter(x=>x.avail&&x.id!==i.id&&x.cat===i.cat).slice(0,3);
 return `<h1 id="h1" tabindex="-1">${l.eh}</h1><div class="alert" role="alert">${ico.warn}<p>${l.eAlert}</p></div>
 <div class="card dim"><span class="meta">${l.eSel}</span><h2>${esc(nm(i))}</h2><div class="meta">${fmtDate(S.dates.start,S.cal)} → ${fmtDate(S.dates.end,S.cal)} · ${fmtTime(S.dates.time)}</div></div>
 <h2 id="altH">${l.alts}</h2><div style="display:flex;flex-direction:column;gap:12px" role="list" aria-labelledby="altH">${alts.map(a=>`<div role="listitem">${itemCard(a,`<button class="btn sm" data-act="pickAlt" data-id="${a.id}">${l.pickAlt}</button>`)}</div>`).join("")}</div>
 <button class="btn sec" data-act="notify">${l.notify}</button><button class="link" data-act="nav" data-v="S1">${l.browse}</button>`}
};

function renderList(){
  if(S.screen!=="S1")return;const l=L(),r=ranked();
  const box=$("#aibox");
  box.innerHTML=`<div class="ai-box"><div class="row sp"><span class="chip aitag" style="border:0;padding-inline:0">${ico.spark} ${l.ordered}</span><button class="switch" role="switch" aria-checked="${S.personalize}" data-act="pers" id="persBtn"><span>${S.personalize?l.on:l.off}</span><i aria-hidden="true"></i><span class="sr">${l.ordered}</span></button></div>
   <p class="small">${!S.personalize?"":r.warm?l.warm(S.events):l.cold}</p>
   ${S.personalize&&r.warm?`<button class="link small" data-act="why" aria-expanded="${S.showWhy}" id="whyBtn">${S.showWhy?l.whyHide:l.why}</button>`:""}
   ${S.showWhy&&r.warm?`<p class="small" role="note">${l.whyTxt(CATNAME[topCat()][isAr()?1:0],S.events,S.user==="demo"?(isAr()?"هندسة الحاسب":"Computer Engineering"):"")}</p>`:""}</div>`;
  $("#count").textContent=l.shown(r.list.length);
  $("#list").innerHTML=r.list.length?r.list.map(i=>{const s=r.sug.has(i.id);
    const extra=`<div class="row sp"><button class="btn sm" data-act="open" data-id="${i.id}" aria-label="${l.view}: ${esc(nm(i))}">${l.view}</button>${s?`<button class="link small" data-act="notRel" data-id="${i.id}" aria-label="${l.notRel}: ${esc(nm(i))}">${l.notRel}</button>`:""}</div>`;
    return itemCard(i,extra).replace('<article class="card"',`<article class="card${s?" sug":""}${i.avail?"":" dim"}"`).replace('<div class="row"><span class="glyph"',s?`<div><span class="chip aitag">${ico.spark} ${l.sugg}</span></div><div class="row"><span class="glyph"`:'<div class="row"><span class="glyph"')}).join(""):`<p class="note">${l.none}</p>`;
}
const SCREENS_S1=SCREENS.S1;SCREENS.S1=function(){const h=SCREENS_S1();setTimeout(renderList,0);return h};

/* ---------- overlay: cancel dialog + assistant ---------- */
function renderOverlay(){
  const l=L(),o=$("#overlay");let h="";
  if(S.dlg){const r=S.requests.find(x=>x.id===S.dlg),i=byId(r.item);
   h=`<div class="scrim" data-act="dlgClose"><div class="sheet center" role="alertdialog" aria-modal="true" aria-labelledby="dH" aria-describedby="dP" data-stop><h2 id="dH">${l.dlgH}</h2><p id="dP">${r.id} · ${esc(nm(i))}<br><span class="meta">${l.dlgP}</span></p><button class="btn sec" data-act="dlgClose" id="dKeep">${l.keep}</button><button class="btn danger" data-act="dlgYes">${l.yesCancel}</button></div></div>`}
  else if(S.voice){
   h=`<div class="scrim" data-act="vClose"><div class="sheet" role="dialog" aria-labelledby="vH" data-stop>
   <div class="row sp"><h2 id="vH">${l.vH}</h2><button class="btn sec sm" data-act="vClose">${l.vClose}</button></div><p class="sub small">${l.vSub}</p>
   <div class="row"><button class="mic-big" data-act="vMic" aria-pressed="${S.listening}" aria-label="${S.listening?l.vStop:l.vStart}">${ico.mic}</button><div class="grow"><div id="vState" role="status" class="small" style="font-weight:600">${S.listening?l.vListening:l.vStart}</div><button class="switch small" role="switch" aria-checked="${S.micOn}" data-act="vMicSw"><span>${l.vMic}: ${S.micOn?l.on:l.off}</span><i aria-hidden="true"></i></button></div></div>
   <div class="log" role="log" aria-live="polite" id="vLog">${S.log.map(m=>`<div class="msg ${m.role}">${m.html}</div>`).join("")}</div>
   <form data-form="say"><label for="say">${l.vType}</label><div class="row"><input id="say" type="text" autocomplete="off"><button class="btn" type="submit">${l.vSend}</button></div></form>
   <details><summary>${l.vExamples}</summary><ul class="small">${l.vEx.map(x=>`<li>${x}</li>`).join("")}</ul></details></div></div>`}
  o.innerHTML=h;
  const lg=$("#vLog");if(lg)lg.scrollTop=lg.scrollHeight;
}
function toast(msg,undo){S.toast={msg,undo};renderToast();clearTimeout(toast.t);toast.t=setTimeout(()=>{S.toast=null;renderToast()},8000)}
function renderToast(){const t=$("#toast");t.innerHTML=S.toast?`<div><span>${esc(S.toast.msg)}</span>${S.toast.undo?`<button data-act="tundo">${L().undo}</button>`:""}</div>`:""}

/* ---------- conversational layer: intent parser ---------- */
function norm(s){return String(s).toLowerCase().replace(/[ً-ْـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه")
  .replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim()}
const PHR=[
 {k:"cancel",en:"cancel my request",ar:"الغ طلبي"},{k:"cancel",en:"i don't need it anymore",ar:"ما احتاجه"},
 {k:"reqs",en:"show my requests",ar:"اعرض طلباتي"},{k:"home",en:"go home",ar:"ارجع للرئيسيه"},
 {k:"find:Raspberry Pi",en:"find raspberry pi",ar:"ابحث عن راسبيري باي"},{k:"find:Arduino",en:"find arduino",ar:"ابحث عن اردوينو"}
];
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];}for(let j=0;j<=b.length;j++)m[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function interpret(text){
  const t=norm(text);
  if(/\b(cancel|withdraw|dont need|do not need|no longer need|remove my request)\b/.test(t)||/(الغ|لا احتاج|ما احتاج|ما عاد احتاج|مب محتاج|سحب)/.test(t))return {k:"cancel",conf:1};
  if(/(my requests|show requests|request status|طلباتي|طلبي|الطلبات|حاله الطلب)/.test(t))return {k:"reqs",conf:1};
  if(/\b(home|go back|main page|browse)\b/.test(t)||/(الرئيسيه|تصفح|رجوع|ارجع)/.test(t))return {k:"home",conf:1};
  for(const [term,ws] of TERMS){if(ws.some(w=>new RegExp(`(^| )${norm(w)}( |$)`).test(t)||(norm(w).length>3&&t.includes(norm(w)))))return {k:"find:"+term,conf:1}}
  let best=null,bs=0;
  for(const p of PHR){for(const s of [norm(p.en),norm(p.ar)]){const r=1-lev(t,s)/Math.max(t.length,s.length);if(r>bs){bs=r;best=p}}}
  if(best&&bs>=0.55)return {k:best.k,conf:bs,guess:true,label:isAr()?best.ar:best.en};
  return {k:"none",conf:0};
}
const labelOf=k=>{const l=L();const m={cancel:isAr()?"ألغِ طلبي":"Cancel my request",reqs:isAr()?"اعرض طلباتي":"Show my requests",home:isAr()?"ارجع للرئيسية":"Go home"};return m[k]||(k.startsWith("find:")?(isAr()?"ابحث عن ":"Find ")+k.slice(5):k)};
function say(role,html){S.log.push({role,html});if(S.voice)renderOverlay()}
function ask(q,onYes,onNo){S.pending={onYes,onNo};say("bot",`${esc(q)}<div class="row"><button class="btn sm" data-act="vYes">${L().yes}</button><button class="btn sec sm" data-act="vNo">${L().no}</button></div>`)}
function answer(yes){const p=S.pending;if(!p)return;S.pending=null;(yes?p.onYes:p.onNo)()}
function yesNo(t){const n=norm(t);if(/^(yes|yeah|yep|ok|okay|sure|correct|right|نعم|ايه|ايوه|اي|صح|تمام|اكيد)$/.test(n))return true;if(/^(no|nope|nah|لا|لاء|ابدا|مو)$/.test(n))return false;return null}
function utter(text,conf){
  text=(text||"").trim();if(!text)return;
  say("me",esc(text));
  if(S.pending){const y=yesNo(text);if(y!==null)return answer(y);S.pending=null}
  if(conf!=null&&conf<0.5)return ask(L().vHeard(text),()=>run(text),()=>say("bot",L().vAgain));
  run(text);
}
function run(text){
  const r=interpret(text),l=L();
  if(r.k==="none")return say("bot",l.vNone);
  if(r.guess)return ask(l.vDid(r.label),()=>exec(r.k),()=>say("bot",l.vAgain));
  exec(r.k);
}
function exec(k){
  const l=L();
  if(k==="cancel"){const p=S.requests.filter(r=>r.status==="pending");
    if(!p.length)return say("bot",l.vNoPend);
    if(p.length>1)return say("bot",`${l.vWhich}<div class="row">${p.map(r=>`<button class="btn sec sm" data-act="vPick" data-id="${r.id}">${r.id}</button>`).join("")}</div>`);
    return confirmCancel(p[0])}
  if(k==="reqs"){go("S6");return say("bot",l.vOpened)}
  if(k==="home"){go("S1");return say("bot",l.vHome)}
  if(k.startsWith("find:")){const term=k.slice(5);S.q=term;recordSearch(term);S.screen="S1";render({keep:true});return say("bot",l.vFound(ranked().list.length,term))}
}
function confirmCancel(r){ask(L().vCQ(r.id,nm(byId(r.item))),()=>{doCancel(r.id);say("bot",`${esc(L().vDone(r.id))}<div class="row"><button class="btn sec sm" data-act="vUndo" data-id="${r.id}">${L().undo}</button></div>`)},()=>say("bot",L().vKept))}
function doCancel(id){const r=S.requests.find(x=>x.id===id);if(!r)return;r.status="cancelled";go("S6",{keep:true});toast(L().toastCancel(id),id)}
function undoCancel(id){const r=S.requests.find(x=>x.id===id);if(r){r.status="pending";render({keep:true});toast(L().undone)}}

/* ---------- voice input ---------- */
let dict=null,rec=null;
try{window.claude?.use?.("dictation").then(d=>{if(!d)return;dict=d;d.onFinal(({text})=>utter(text,null));d.onState(({state})=>{S.listening=state==="listening";if(S.voice)renderOverlay()})}).catch(()=>{})}catch(e){}
async function startListen(){
  const l=L();
  if(!S.micOn)return say("bot",l.micOff);
  if(S.listening){if(dict)try{await dict.stop()}catch(e){}if(rec)try{rec.stop()}catch(e){}S.listening=false;return renderOverlay()}
  if(dict){try{await dict.start()}catch(e){say("bot",e&&e.code==="not_granted"?l.micDenied:l.micFail)}return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return say("bot",l.noVoice);
  try{rec=new SR();rec.lang=isAr()?"ar-SA":"en-US";rec.interimResults=false;rec.maxAlternatives=1;
   rec.onresult=e=>{const r=e.results[0][0];utter(r.transcript,r.confidence)};
   rec.onerror=e=>{S.listening=false;say("bot",e.error==="no-speech"?l.noSpeech:(e.error==="not-allowed"||e.error==="service-not-allowed")?l.micDenied:l.micFail)};
   rec.onend=()=>{S.listening=false;if(S.voice)renderOverlay()};
   rec.start();S.listening=true;renderOverlay()}catch(e){S.listening=false;say("bot",l.micFail)}
}

/* ---------- facilitator panel ---------- */
function renderFac(){
  const f=$("#fac");f.hidden=location.hash!=="#facilitator";if(f.hidden)return;
  f.innerHTML=`<div class="card"><h2>Facilitator controls (not for participants)</h2>
  <label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" id="armE1" ${S.armE1?"checked":""} style="width:22px;height:22px"> Arm error E1: the next “Confirm and send request” reports the tool as taken (use before T2)</label>
  <div class="row" style="flex-wrap:wrap"><button class="btn sec sm" data-act="fReset">Reset app (start of T1)</button><button class="btn sec sm" data-act="fT3">Load T3 start (1 pending request, demo user)</button></div>
  <p class="meta small">Open this page with #facilitator at the end of the link to see these controls. Adaptive layer events so far: ${S.events}.</p></div>`;
}
addEventListener("hashchange",renderFac);

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  if(e.target.closest("[data-stop]")&&!e.target.closest("[data-act]"))return;
  const b=e.target.closest("[data-act]");if(!b)return;
  if(b.classList.contains("scrim")&&e.target!==b)return;
  const a=b.dataset.act,v=b.dataset.v,id=b.dataset.id;
  switch(a){
   case "lang":LANG=v;render({keep:true});break;
   case "tab":S.tab=v;render({keep:true});break;
   case "demo":seedDemo();go("S1");break;
   case "signout":S=fresh();go("S0");break;
   case "nav":go(v);break;
   case "fAvail":S.fAvail=!S.fAvail;render({focus:"#fA"});break;
   case "fCampus":S.fCampus=!S.fCampus;render({focus:"#fC"});break;
   case "clearF":S.fAvail=S.fCampus=false;S.q="";render({focus:"#q"});break;
   case "pers":S.personalize=!S.personalize;renderList();$("#persBtn").focus();break;
   case "why":S.showWhy=!S.showWhy;renderList();$("#whyBtn").focus();break;
   case "notRel":{const i=byId(+id);S.dismissed.add(i.id);learn(i.cat,-2);renderList();toast(L().gotIt,"nr"+i.id);break}
   case "open":{const i=byId(+id);S.sel=i.id;learn(i.cat,1);S.recovery=false;go("S2");break}
   case "toDates":go("S3");break;
   case "keepDates":go("S4");break;
   case "cal":S.cal=v;render({keep:true,focus:`[data-v="${v}"]`});break;
   case "confirm":
     if(S.armE1){S.armE1=false;S.e1Item=S.sel;go("E1")}
     else{S.seq++;const r={id:"CL-"+String(S.seq).padStart(3,"0"),item:S.sel,start:S.dates.start,end:S.dates.end,time:S.dates.time,status:"pending"};S.requests.push(r);learn(byId(S.sel).cat,3);S.dates=null;S.recovery=false;go("S5")}
     break;
   case "pickAlt":S.sel=+id;S.recovery=true;learn(byId(S.sel).cat,1);go("S2");break;
   case "notify":toast(L().notifyT);break;
   case "askCancel":S.dlg=id;renderOverlay();setTimeout(()=>$("#dKeep")?.focus(),0);break;
   case "dlgClose":{const i=S.dlg;S.dlg=null;renderOverlay();$("#c_"+i)?.focus();break}
   case "dlgYes":{const i=S.dlg;S.dlg=null;doCancel(i);break}
   case "tundo":{const u=S.toast&&S.toast.undo;S.toast=null;if(u&&u.startsWith("nr")){const i=byId(+u.slice(2));S.dismissed.delete(i.id);learn(i.cat,2);renderList();toast(L().undone)}else if(u)undoCancel(u);else renderToast();break}
   case "voice":S.voice=true;if(!S.log.length)S.log.push({role:"bot",html:esc(L().vHello)});renderOverlay();setTimeout(()=>$("#say")?.focus(),0);break;
   case "vClose":S.voice=false;if(S.listening&&rec)try{rec.stop()}catch(e){}renderOverlay();break;
   case "vMic":startListen();break;
   case "vMicSw":S.micOn=!S.micOn;if(!S.micOn&&rec)try{rec.stop()}catch(e){}renderOverlay();break;
   case "vYes":answer(true);break;case "vNo":answer(false);break;
   case "vPick":confirmCancel(S.requests.find(r=>r.id===id));break;
   case "vUndo":undoCancel(id);say("bot",esc(L().undone));break;
   case "fReset":{const e=S.armE1;S=fresh();S.armE1=e;go("S0");break}
   case "fT3":{S=fresh();seedDemo();S.seq=1;S.requests=[{id:"CL-001",item:3,start:addDays(todayISO(),3),end:addDays(todayISO(),6),time:"12:30",status:"pending"}];go("S1");break}
  }
});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target.dataset.form;
  if(f==="login"){const v=$("#em").value.trim();if(!v){S.emailErr=true;render({focus:"#em"});return}
    S.emailErr=false;if(S.tab==="signup"){S.user="new"}else seedDemo();go("S1")}
  if(f==="search"){S.q=$("#q").value.trim();if(S.q)recordSearch(S.q);renderList();$("#q").focus()}
  if(f==="dates"){const d=S.dates,i=byId(S.sel),l=L(),er={};
    if(!d.start||!d.end)er.d1=l.eBoth;
    else if(d.start<todayISO())er.d1=l.ePast;
    else if(d.end<d.start)er.d2=l.eOrder;
    else if(diff(d.start,d.end)+1>i.max)er.d2=l.eLong(i.max,fmtDate(addDays(d.start,i.max-1),"greg"));
    if(Object.keys(er).length){S.errs=er;render({focus:er.d1?"#d1":"#d2"});return}
    go("S4")}
  if(f==="say"){const x=$("#say");const t=x.value;x.value="";utter(t,null);$("#say")?.focus()}
});
document.addEventListener("change",e=>{
  if(e.target.id==="d1")S.dates.start=e.target.value;
  if(e.target.id==="d2")S.dates.end=e.target.value;
  if(e.target.id==="tm")S.dates.time=e.target.value;
  if(e.target.id==="armE1")S.armE1=e.target.checked;
});
document.addEventListener("input",e=>{if(e.target.id==="q"&&S.screen==="S1"){S.q=e.target.value;renderList()}});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(S.dlg){S.dlg=null;renderOverlay()}else if(S.voice){S.voice=false;renderOverlay()}}
  if(e.ctrlKey&&e.altKey&&e.key.toLowerCase()==="f"){location.hash=location.hash==="#facilitator"?"":"facilitator"}
});
window.__CL={get S(){return S},go,render,seedDemo,utter,setLang(x){LANG=x;render()},doCancel,interpret};
render();
</script>
